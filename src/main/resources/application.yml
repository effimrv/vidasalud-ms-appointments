server:
  port: 8081
spring:
  application:
    name: vidasalud-ms-appointments
  rabbitmq:
    # Lista de nodos del clúster: si un nodo cae, el cliente se reconecta al siguiente.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASS:vidasalud}
    # Si RabbitMQ no responde, la cita se guarda igual: no se bloquea la petición HTTP más de esto.
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
  datasource:
    url: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.zcmgjhgjvtlceacwjuvv
    password: VidaSalud1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

# Nombres de mensajería centralizados (misma estructura que ms-notify): el publicador no escribe nombres a mano.
vidasalud:
  mensajeria:
    exchanges:
      # Exchange topic al que se publican los eventos de citas (lo consumen las colas de ms-notify).
      citas: vidasalud.citas.topic
    # Routing key de cada evento del ciclo de vida de una cita.
    routing-keys:
      creada: cita.creada
      confirmada: cita.confirmada
      en-espera: cita.en_espera
      en-atencion: cita.en_atencion
      cerrada: cita.cerrada
      cancelada: cita.cancelada

  # Simulación de la operación del centro (acelerada para la demostración).
  flujo:
    # Avanza solo cada cita: revisión, confirmación, llegada, atención y cierre.
    automatico: true
    intervalo-ms: 5000
    # Tiempo que una cita permanece en cada estado antes de pasar al siguiente.
    tiempos:
      solicitada: 15s     # revisión automática de la solicitud
      confirmada: 25s     # llegada del paciente (check-in)
      en-espera: 25s      # llamado al box
      en-atencion: 40s    # duración de la consulta
    agenda:
      zona-horaria: America/Santiago
      bloques: ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "15:00", "15:30", "16:00", "16:30"]
      # Porcentaje de horas que la agenda de cada profesional tiene bloqueadas (varía por día y especialidad).
      porcentaje-bloqueado: 20
    # Pacientes simulados que reservan (y a veces cancelan) horas libres cada cierto tiempo.
    demanda:
      # Se apaga con la variable de entorno DEMANDA_SIMULADA=false.
      habilitada: ${DEMANDA_SIMULADA:true}
      intervalo-ms: 60000
      probabilidad-reserva: 0.6
      probabilidad-cancelacion: 0.1
      # Tope de reservas simuladas con fecha futura: la agenda tiene movimiento sin llenarse.
      maximo-reservas-futuras: 12
      dias-horizonte: 10
      # Las reservas simuladas finalizadas o canceladas se eliminan pasado este tiempo (las reales nunca).
      limpieza-tras: 30m
      limpieza-intervalo-ms: 300000
